# Port 8080, not 80: this runs on nginxinc/nginx-unprivileged as UID 101, which cannot
# bind a privileged port.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
